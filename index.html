<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>LiS.sint</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
    <link rel="icon" href="images/icon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="scripts/script_2.js" defer></script>
  </head>

  <body>
    <video class="bg-video" autoplay muted loop playsinline poster="images/background-img.png">
    <source src="videos/lis_video_2.mp4" type="video/mp4">
  </video>
    <!-- _______________Название синтезатора_______________ -->
   <section class="sintName">
    <h1 class="lis">LIS SINTEZATOR</h1>
    <p class="autumn">Put together the melody of autumn</p>
   </section>

   <img src="images/cdDisk.png" alt="" class="sticker_1">
   <img src="images/butterfly.png" alt="" class="sticker_2">
   <img src="images/letter.png" alt="" class="sticker_3">
   <img src="images/dontMove.png" alt="" class="sticker_4">
   <img src="images/supeheroes.png" alt="" class="sticker_5">
   <img src="images/me.png" alt="" class="sticker_6">

   <!-- _________________секции с голосами_________________ -->
   <section class="voices">
    <div class="glassCard_first" id="max">
      <div class="glassEf">
        <h2 class="max">Max</h2>
        <div class="buttons">
          <button class="play-btn buttonMax">
            <img src="./images/swirl.svg" class="spiral" alt="Иконка">STORM</button>
          <button class="stop-btn buttonMax">
            <img src="./images/spiral_original.svg" class="spiral" alt="Иконка">REWIND</button>
        </div>
        <div class="row">
          <label for=""><img src="./images/arrow_spiral_original.svg" class="spiral" alt="Иконка"></label>
          <input type="range" class="tempo" id="tempoMax" min="40" max="120" step="1" value="78">
          <span class="tempo-value">78 bpm</span>
        </div>
        <div class="row">
          <label for=""><img src="./images/mps.svg" class="spiral" alt="Иконка"></label>
          <input type="range" class="volume" id="volumeMax" min="0" max="1" step="0.1" value="0.8">
          <span class="volume-value">0.8</span>
        </div>
      </div>
    </div>
    <div class="glassCard_second" id="chloe">
      <div class="glassEf">
        <h2 class="chloe">Chloe</h2>
        <div class="buttons">
          <button class="play-btn buttonChloe"><img src="./images/stylized_a.svg" class="spiral" alt="Иконка">RACHEL</button>
          <button class="stop-btn buttonChloe"><img src="./images/dad.svg" class="spiral" alt="Иконка">WILLIAM</button>
        </div>
        <div class="row">
          <label for=""><img src="./images/bag.svg" class="spiral" alt="Иконка"></label>
          <input type="range" class="tempo" id="tempoChloe" min="40" max="120" step="1" value="78">
          <span class="tempo-value">78 bpm</span>
        </div>
        <div class="row">
          <label for=""><img src="./images/circle_logo.svg" class="spiral" alt="Иконка"></label>
          <input type="range" class="volume" id="volumeChloe" min="0" max="1" step="0.1" value="0.8">
          <span class="volume-value">0.8</span>
        </div>
      </div>
    </div>
   </section>
   
   <!-- ___________________секция с эффектами___________________ -->
   <section class="effects">
    <div class="card_1" id="osc-max">
      <h3>TWO WALES</h3>
      <div class="field">
        <label class="efName_1">Joyce</label>
        <select class="wave" id="selectMax">
          <option value="triangle">fried egg</option>
          <option value="sine">waffles</option>
          <option value="square">coffee</option>
          <option value="sawtooth">salad</option>
        </select>
      </div>
      <div class="field">
            <label class="efName_2">Warren</label>
            <select class="octave" id="selectMax">
              <option value="-12">maximus</option>
              <option value="0" selected>go appes</option>
              <option value="12">C U TE</option>
            </select>
          </div>
          <div class="field">
            <label class="efName_3">Menu</label>
            <div class="row">
              <input type="range" class="detune" id="detuneMax" min="-100" max="100" step="1" value="0" />
              <span class="value detune-value">0 ct</span>
            </div>
          </div>
    </div>

    <div class="card_2" id="filter-max">
      <h3>DARK ROOM</h3>
              <div class="field">
                <label>Vortex Club</label>
                <select class="filter-type" id="selectMax">
                  <option value="lowpass">Victoria</option>
                  <option value="highpass">Nathan</option>
                  <option value="bandpass">Mark Jefferson</option>
                </select>
              </div>
              <div class="field">
                <label>San Francisco</label>
                <div class="row">
                  <input
                    type="range"
                    class="cutoff" id="cutoffMax"
                    min="100"
                    max="5000"
                    step="10"
                    value="1800"
                  />
                  <span class="value cutoff-value">1800 Гц</span>
                </div>
              </div>
              <div class="field">
                <label>Everyday Hero</label>
                <div class="row">
                  <input
                    type="range"
                    class="resonance" id="resonanceMax"
                    min="0"
                    max="10"
                    step="0.5"
                    value="3"
                  />
                  <span class="value resonance-value">3</span>
                </div>
              </div>
    </div>

    <div class="card_3" id="osc-chloe">
      <h3>JUNK YARD</h3>
      <div class="field">
        <label class="efName_1">Frank</label>
        <select class="wave" id="selectChloe">
          <option value="triangle">Braclet</option>
          <option value="sine">Pompidou</option>
          <option value="square">Lion</option>
          <option value="sawtooth">Bigfoots</option>
        </select>
      </div>
      <div class="field">
            <label class="efName_2">David</label>
            <select class="octave" id="selectChloe">
              <option value="-12">War Veteran</option>
              <option value="0" selected>StepDoushe</option>
              <option value="12">Father</option>
            </select>
          </div>
          <div class="field">
            <label class="efName_3">Bluebeard</label>
            <div class="row">
              <input type="range" class="detune" id="detuneChloe" min="-100" max="100" step="1" value="0" />
              <span class="value detune-value">0 ct</span>
            </div>
          </div>
    </div>

    <div class="card_4" id="filter-chloe">
      <h3>STORM</h3>
              <div class="field">
                <label>October 11th</label>
                <select class="filter-type" id="selectChloe">
                  <option value="lowpass">Bumper shot</option>
                  <option value="highpass">Train rail</option>
                  <option value="bandpass">Blackwell Academy</option>
                </select>
              </div>
              <div class="field">
                <label>Memories</label>
                <div class="row">
                  <input
                    type="range"
                    class="cutoff" id="cutoffChloe"
                    min="100"
                    max="5000"
                    step="10"
                    value="1800"
                  />
                  <span class="value cutoff-value">1800 Гц</span>
                </div>
              </div>
              <div class="field">
                <label>Everybody lies</label>
                <div class="row">
                  <input
                    type="range"
                    class="resonance" id="resonanceChloe"
                    min="0"
                    max="10"
                    step="0.5"
                    value="3"
                  />
                  <span class="value resonance-value">3</span>
                </div>
              </div>
    </div>
          
    <img src="images/photoCard_svg_1.svg" alt="" class="photo_1">
    <img src="images/photoCard_svg_2.svg" alt="" class="photo_2">
    <img src="images/photoCard_svg_1.svg" alt="" class="photo_3">
    <img src="images/photoCard_svg_2.svg" alt="" class="photo_4">
   </section>

   <!-- ________________Секция с фильтром эхо и реверберацией________________ -->
   <section class="effects_2">
    <!-- _________________эхо и реверберация Макс_________________ -->
      <div class="echo">
        <div class="card_5" id="fx-echo-max">
          <h3>INNOCENCE</h3>
          <div class="field">
            <label>Next Victim</label>
            <select class="echo-time" id="selectMax">
              <option value="8n">Kate</option>
              <option value="8n.">Juellete</option>
              <option value="4n">Dana</option>
            </select>
          </div>
          <div class="field">
            <label>EVIDENCE</label>
            <div class="row">
              <input type="range" class="echo-wet" id="echoWetMax" min="0" max="1" step="0.05" value="0" />
              <span class="value echo-wet-value">0%</span>
            </div>
          </div>
          <div class="field">
            <label>CODE</label>
            <div class="row">
              <input type="range" class="echo-feedback" id="echoFeedbackMax" min="0" max="0.9" step="0.05" value="0.35" />
              <span class="value echo-feedback-value">35%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="reverb">
        <div class="card_6" id="fx-reverb-max">
          <h3>TWO VERSIONS</h3>
          <div class="field">
            <label>Sad</label>
            <div class="row">
              <input type="range" class="reverb-wet" id="reverbWetMax" min="0" max="1" step="0.05" value="0" />
              <span class="value reverb-wet-value">0%</span>
            </div>
          </div>
          <div class="field">
            <label>Happy</label>
            <div class="row">
              <input type="range" class="reverb-decay" id="reverbDecayMax" min="0.5" max="6" step="0.5" value="2.5" />
              <span class="value reverb-decay-value">2.5 с</span>
            </div>
          </div>
        </div>
      </div>

      <!-- _________________эхо и реверберация Хлоя_________________ -->
       
      <div class="echo">
        <div class="card_7" id="fx-echo-chloe">
          <h3>MEMORIES</h3>
          <div class="field">
            <label>Sara</label>
            <select class="echo-time" id="selectChloe">
              <option value="8n">NO</option>
              <option value="8n.">YES</option>
              <option value="4n">LIE</option>
            </select>
          </div>
          <div class="field">
            <label>Pictures</label>
            <div class="row">
              <input type="range" class="echo-wet" id="echoWetChloe" min="0" max="1" step="0.05" value="0" />
              <span class="value echo-wet-value">0%</span>
            </div>
          </div>
          <div class="field">
            <label>Perfect</label>
            <div class="row">
              <input type="range" class="echo-feedback" id="echoFeedbackChloe" min="0" max="0.9" step="0.05" value="0.35" />
              <span class="value echo-feedback-value">35%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="reverb">
        <div class="card_8" id="fx-reverb-chloe">
          <h3>NO WAY</h3>
          <div class="field">
            <label>Psycho</label>
            <div class="row">
              <input type="range" class="reverb-wet" id="reverbWetChloe" min="0" max="1" step="0.05" value="0" />
              <span class="value reverb-wet-value">0%</span>
            </div>
          </div>
          <div class="field">
            <label>Pirates</label>
            <div class="row">
              <input type="range" class="reverb-decay" id="reverbDecayChloe" min="0.5" max="6" step="0.5" value="2.5" />
              <span class="value reverb-decay-value">2.5 с</span>
            </div>
          </div>
        </div>
      </div>

      <img src="images/photoCard_svg_1.svg" alt="" class="photo_5">
      <img src="images/photoCard_svg_2.svg" alt="" class="photo_6">
      <img src="images/photoCard_svg_1.svg" alt="" class="photo_7">
      <img src="images/photoCard_svg_2.svg" alt="" class="photo_8">
   </section>
  </body>
</html>
